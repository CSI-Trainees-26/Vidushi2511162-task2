<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pace — Habits</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <!-- SIDEBAR (same on every page — this IS the multi-page nav now) -->
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">●</span>
      <span class="brand-name">Pace</span>
    </div>
    <nav class="nav">
      <a href="index.html" class="nav-item">Dashboard</a>
      <a href="tasks.html" class="nav-item">Tasks</a>
      <a href="habits.html" class="nav-item active">Habits</a>
      <a href="water-sleep.html" class="nav-item">Water & Sleep</a>
      <a href="pomodoro.html" class="nav-item">Pomodoro</a>
      <a href="quotes.html" class="nav-item">Quotes</a>
      <a href="summary.html" class="nav-item">Weekly Summary</a>
    </nav>
    <div class="sidebar-footer">
      <span id="todayDateSide"></span>
    </div>
  </aside>

  <!-- MAIN: only this page's section, always visible, nothing else loaded -->
  <main class="main">
    <section class="view active" id="habits">
      <header class="view-header">
        <div>
          <h1>Habits</h1>
          <p class="subdate">Recurring activities you're building over time</p>
        </div>
      </header>

      <form class="card add-form" id="habitForm">
        <input type="text" id="habitInput" placeholder="Habit name (e.g. 1K steps)" required>
        <select id="habitCategory">
          <option>Workout</option>
          <option>Fitness</option>
          <option>Cardio</option>
          <option>Mental Wellness</option>
        </select>
        <button type="submit" class="btn-primary">Add habit</button>
      </form>

      <div class="habit-list" id="habitList"></div>
    
    </section>
  </main>
</div>

<script src="script.js"></script>
</body>
</html>
