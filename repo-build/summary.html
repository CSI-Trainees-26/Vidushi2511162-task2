<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pace — Weekly Summary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <!-- SIDEBAR (same on every page — this IS the multi-page nav now) -->
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">●</span>
      <span class="brand-name">Pace</span>
    </div>
    <nav class="nav">
      <a href="index.html" class="nav-item">Dashboard</a>
      <a href="tasks.html" class="nav-item">Tasks</a>
      <a href="habits.html" class="nav-item">Habits</a>
      <a href="water-sleep.html" class="nav-item">Water & Sleep</a>
      <a href="pomodoro.html" class="nav-item">Pomodoro</a>
      <a href="quotes.html" class="nav-item">Quotes</a>
      <a href="summary.html" class="nav-item active">Weekly Summary</a>
    </nav>
    <div class="sidebar-footer">
      <span id="todayDateSide"></span>
    </div>
  </aside>

  <!-- MAIN: only this page's section, always visible, nothing else loaded -->
  <main class="main">
    <section class="view active" id="summary">
      <header class="view-header">
        <div>
          <h1>Weekly summary</h1>
          <p class="subdate">Last 7 days at a glance</p>
        </div>
      </header>

      <div class="grid three-col">
        <div class="card">
          <h3>Tasks</h3>
          <ul class="summary-list" id="summaryTasks"></ul>
        </div>
        <div class="card">
          <h3>Habits</h3>
          <ul class="summary-list" id="summaryHabits"></ul>
        </div>
        <div class="card">
          <h3>Fitness</h3>
          <ul class="summary-list" id="summaryFitness"></ul>
        </div>
      </div>

      <div class="card">
        <h3>Sleep this week</h3>
        <div class="chart-bars" id="summarySleepChart"></div>
      </div>
    
    </section>
  </main>
</div>

<script src="script.js"></script>
</body>
</html>
